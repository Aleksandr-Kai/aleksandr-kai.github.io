<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Панель автоответов</title>
<meta name="robots" content="noindex">
<script src="i18n.js"></script>
<script>document.documentElement.dataset.theme=localStorage.getItem("aicrm_theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="desk">
<div class="window">
<div class="titlebar"><span class="dots"><i></i><i></i><i></i></span><b>Панель автоответов</b></div>
<div id="guide" class="guide" hidden></div>
<div class="app">
  <aside class="side">
    <div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.5 7.2L4 20l1-4.5A8 8 0 1 1 21 12z"/><path d="M9 11h6M9 14h3"/></svg></div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">
      <a href="#" id="theme-toggle">☾ Тёмная тема</a>
      <a href="#" id="dock-toggle">⇄ Скрыть мессенджер</a>
      <a href="#" id="lang-toggle"></a>
      <span id="engine">● Движок активен</span>
    </div>
  </aside>
  <main id="view"></main>
</div>
</div>
  <aside class="dock" id="dock"><iframe src="messenger.html?embed" title="Эмулятор мессенджера"></iframe></aside>
</div>
<div id="rotate" class="rotate" hidden><div><b>Демо рассчитано на компьютер</b><p>С телефона поверните его горизонтально, а лучше откройте демо на компьютере: так будут видны панель и мессенджер одновременно.</p><button class="btn primary" id="rotate-ok">Всё равно продолжить</button></div></div>
<div id="modal"></div>
<div id="toast"></div>
<script src="core.js"></script>
<script src="ai.js"></script>
<script src="app.js"></script>
<script>
const lt=document.getElementById('lang-toggle');
lt.textContent=LANG==='en'?'RU · Русский':'EN · English';
lt.onclick=e=>{e.preventDefault();localStorage.setItem('landing-language',LANG==='en'?'ru':'en');location.reload()};
const rot=document.getElementById('rotate');
const needRotate=()=>!sessionStorage.getItem('rotate_ok')&&(innerWidth<760||(innerHeight>innerWidth&&innerWidth<1000));
const checkRotate=()=>{rot.hidden=!needRotate()};
document.getElementById('rotate-ok').onclick=()=>{try{sessionStorage.setItem('rotate_ok','1')}catch(e){}checkRotate()};
addEventListener('resize',checkRotate);addEventListener('orientationchange',checkRotate);checkRotate();
const dock=document.getElementById('dock'),tg=document.getElementById('dock-toggle');
tg.onclick=e=>{e.preventDefault();dock.classList.toggle('hide');tg.textContent=dock.classList.contains('hide')?'⇄ Показать мессенджер':'⇄ Скрыть мессенджер'};
</script>
</body>
</html>
